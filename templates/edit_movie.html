{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-warning text-dark text-center">

                    <h2>
                        ✏️ Edit Movie
                    </h2>

                </div>

                <div class="card-body p-4">

                    <form
                        action="/edit-movie/{{ movie.id }}"
                        method="POST"
                        onsubmit="return validateMovieForm()">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    🆔 Movie ID

                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    value="{{ movie.id }}"
                                    readonly>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    🎬 Movie Title

                                </label>

                                <input
                                    type="text"
                                    name="title"
                                    class="form-control"
                                    value="{{ movie.title }}"
                                    required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    📅 Release Year

                                </label>

                                <input
                                    type="number"
                                    name="year"
                                    class="form-control"
                                    value="{{ movie.year }}"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    ⭐ Rating

                                </label>

                                <input
                                    type="number"
                                    step="0.1"
                                    min="0"
                                    max="10"
                                    name="rating"
                                    class="form-control"
                                    value="{{ movie.rating }}"
                                    required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    ⏰ Duration (Minutes)

                                </label>

                                <input
                                    type="number"
                                    name="duration"
                                    class="form-control"
                                    value="{{ movie.duration }}"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    🎭 Genre

                                </label>

                                <input
                                    type="text"
                                    name="genre"
                                    class="form-control"
                                    value="{{ movie.genre }}">

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    🎥 Director

                                </label>

                                <input
                                    type="text"
                                    name="director"
                                    class="form-control"
                                    value="{{ movie.director }}">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    🎬 Actor

                                </label>

                                <input
                                    type="text"
                                    name="actor"
                                    class="form-control"
                                    value="{{ movie.actor }}">

                            </div>

                        </div>

                        <div class="text-center mt-4">

                            <button
                                class="btn btn-warning btn-lg">

                                💾 Update Movie

                            </button>

                            <a
                                href="/movies-page"
                                class="btn btn-secondary btn-lg">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
